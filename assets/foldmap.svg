<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 400" width="600" height="400">
  <!-- Decorative map for the cover's folded map. Not a real survey. -->
  <defs>
    <!-- The river's course. Contours are copies of it shifted up and down, so
         they follow the valley and never cross. -->
    <path id="course" d="M-40 118C70 100 140 168 220 182S360 228 420 296 540 362 640 352"/>
    <clipPath id="sheet"><rect x="10" y="10" width="580" height="380"/></clipPath>
  </defs>

  <rect width="600" height="400" fill="#F0E8D5"/>

  <g clip-path="url(#sheet)">
    <!-- Contours: tight near the river (the bluffs), wider beyond. Every fifth is heavier. -->
    <g fill="none" stroke="#B07A4C" stroke-width="0.9" opacity="0.8">
      <use xlink:href="#course" href="#course" y="-24"/>
      <use xlink:href="#course" href="#course" y="-34"/>
      <use xlink:href="#course" href="#course" y="-44"/>
      <use xlink:href="#course" href="#course" y="-54"/>
      <use xlink:href="#course" href="#course" y="-64" stroke-width="1.7"/>
      <use xlink:href="#course" href="#course" y="-82"/>
      <use xlink:href="#course" href="#course" y="-102"/>
      <use xlink:href="#course" href="#course" y="-126"/>
      <use xlink:href="#course" href="#course" y="-152"/>
      <use xlink:href="#course" href="#course" y="-180" stroke-width="1.7"/>
      <use xlink:href="#course" href="#course" y="-212"/>
      <use xlink:href="#course" href="#course" y="-246"/>
      <use xlink:href="#course" href="#course" y="-282"/>
      <use xlink:href="#course" href="#course" y="-320"/>
      <use xlink:href="#course" href="#course" y="-360" stroke-width="1.7"/>

      <use xlink:href="#course" href="#course" y="24"/>
      <use xlink:href="#course" href="#course" y="34"/>
      <use xlink:href="#course" href="#course" y="44"/>
      <use xlink:href="#course" href="#course" y="54"/>
      <use xlink:href="#course" href="#course" y="64" stroke-width="1.7"/>
      <use xlink:href="#course" href="#course" y="82"/>
      <use xlink:href="#course" href="#course" y="102"/>
      <use xlink:href="#course" href="#course" y="126"/>
      <use xlink:href="#course" href="#course" y="152"/>
      <use xlink:href="#course" href="#course" y="180" stroke-width="1.7"/>
      <use xlink:href="#course" href="#course" y="212"/>
      <use xlink:href="#course" href="#course" y="246"/>
      <use xlink:href="#course" href="#course" y="282"/>
    </g>

    <!-- River -->
    <use xlink:href="#course" href="#course" fill="none" stroke="#4CBBEC" stroke-width="18" stroke-linecap="round"/>
  </g>

  <!-- Legend -->
  <g transform="translate(22 284) scale(1.6)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#2A2520">
    <rect width="118" height="62" fill="#F7F2E6" stroke="#7A6247" stroke-width="1"/>
    <text x="10" y="15" font-size="8" font-weight="700" letter-spacing="1.6" fill="#7A6247">LEGEND</text>
    <line x1="10" y1="28" x2="34" y2="28" stroke="#4CBBEC" stroke-width="5" stroke-linecap="round"/>
    <text x="42" y="31.5">River</text>
    <line x1="10" y1="41" x2="34" y2="41" stroke="#B07A4C" stroke-width="1.2"/>
    <text x="42" y="44.5">Contour</text>
    <path d="M17 50 25 58M25 50 17 58" stroke="#D23A2A" stroke-width="2.2" stroke-linecap="round"/>
    <text x="42" y="57.5">?</text>
  </g>

  <!-- Neatline -->
  <rect x="10" y="10" width="580" height="380" fill="none" stroke="#7A6247" stroke-width="1.5"/>
</svg>
